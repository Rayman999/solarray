version: "3.8"

services:
  solarray:
    image: ghcr.io/rayman999/solarray:latest
    networks:
      - traefik-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.solarray.rule=Host(`solarray.lluminaa.net`)"
        - "traefik.http.routers.solarray.entrypoints=websecure"
        - "traefik.http.routers.solarray.tls=true"
        - "traefik.http.routers.solarray.tls.certresolver=letsencrypt"
        - "traefik.http.services.solarray.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-net"

networks:
  traefik-net:
    external: true
